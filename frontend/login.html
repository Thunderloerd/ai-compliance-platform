<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | AI Compliance Intelligence</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply the saved theme before the page is drawn (no flash of the wrong colors).
    try {
      if (localStorage.getItem("compliance-theme") === "light") {
        document.documentElement.classList.remove("dark");
      }
    } catch (error) {}
  </script>
</head>
<body>
  <div class="login-page">
    <div class="login-glow"></div>

    <div class="login-inner">
      <div class="login-box">
        <div class="login-card">
          <div class="login-logo">AI</div>
          <h1 class="login-title">Sign in</h1>
          <p class="login-subtitle">AI Compliance Intelligence Platform</p>

          <form id="login-form" style="margin-top:2rem">
            <!-- The message box shows problems, for example a wrong password. -->
            <div id="login-message" class="alert alert-error hidden" style="margin-bottom:1rem"></div>

            <div class="field">
              <label for="email">Email</label>
              <input class="input" type="email" id="email" placeholder="you@company.com" autocomplete="username" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
                <button class="password-toggle" type="button" id="toggle-password" title="Show password">Show</button>
              </div>
            </div>

            <div class="login-hint">Use the email and password from your admin to sign in.</div>

            <button class="btn btn-gradient" type="submit" id="login-button" style="margin-top:1.25rem">Sign in</button>
          </form>
        </div>
      </div>

      <p class="login-foot"><a href="index.html">Back to home</a></p>
    </div>
  </div>

  <!-- config.js holds the backend address, api.js makes the calls, auth.js knows the roles. -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
